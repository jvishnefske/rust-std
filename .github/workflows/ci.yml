name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 natively, plus aarch64 under qemu
          - name: x86_64 + aarch64/qemu
            runner: ubuntu-24.04
            qemu: true
          # aarch64 natively (x86_64 is then only built and checked)
          - name: aarch64
            runner: ubuntu-24.04-arm
            qemu: false
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the nightly (with rust-src); rustup
      # installs it on first use
      - name: Show toolchain
        run: rustup show

      - name: Install qemu user-mode emulation
        if: matrix.qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          echo "QEMU_AARCH64=$(command -v qemu-aarch64)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps

      # fails if the patch series no longer applies to the pinned rust-src
      - name: Patched std sources
        run: cargo xtask sysroot

      - name: Clippy
        run: cargo clippy -p linux_none_rt -p xtask -p harness --all-targets -- -D warnings

      # examples, std's own test suite, and differential fuzzing against the
      # host's std, on both architectures
      - name: Test
        run: cargo test

  kani:
    name: kani proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          working-directory: rt
