cargo-features = ["profile-rustflags"]

[workspace]
members = ["examples", "fuzzee", "stdtests"]
resolver = "3"

[profile.dev]
panic = "abort"

# memcpy, memset and memcmp come from compiler_builtins; unoptimized they
# are byte loops, which made the fuzzer's `alloc` target ~10x slower. (cargo
# warns that the spec matches no packages, but -Zbuild-std units use it.)
[profile.dev.package.compiler_builtins]
opt-level = 3

[profile.release]
panic = "abort"

# std's test suites use features that std's own build enables for them
[profile.dev.package.stdtests]
rustflags = ["-Zcrate-attr=feature(sync_poison_mod)"]
