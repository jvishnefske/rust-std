cargo-features = ["profile-rustflags"]

[workspace]
members = ["examples", "fuzzee", "stdtests"]
resolver = "3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# std's test suites use features that std's own build enables for them
[profile.dev.package.stdtests]
rustflags = ["-Zcrate-attr=feature(sync_poison_mod)"]
