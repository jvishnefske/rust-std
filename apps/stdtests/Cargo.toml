[package]
name = "stdtests"
version = "0.1.0"
edition = "2024"
publish = false
description = "std's own integration tests (library/std/tests of the patched tree), built for linux-none"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[dev-dependencies]
rand = { version = "0.9.0", default-features = false, features = ["alloc"] }
rand_xorshift = "0.4.0"

[[test]]
name = "ambiguous-hash_map"
path = "../../target/linux-none/std-src/library/std/tests/ambiguous-hash_map.rs"

