[package]
name = "harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-side tests: builds the apps/ programs with std for linux-none and checks them"

[lib]
path = "src/lib.rs"

[dependencies]
xtask = { path = "../xtask" }

[dev-dependencies]
# host-side tests of the runtime's pure parts (the vDSO parser), and of
# its DNS resolver against a fake server (tests/dns.rs)
linux_none_rt = { path = "../rt" }
